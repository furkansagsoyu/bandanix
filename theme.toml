# Bandanix ortak tema dosyası
# Bütün Bandanix parçaları bu dosyayı okur, böylece hepsi aynı ailedenmiş gibi görünür.
# Kurulduğu yer: ~/.config/bandanix/theme.toml  (oradaki değişikliklerin yeniden kurulumda korunur)
# Düzenledikten sonra parçayı yeniden başlat (ör. Sound Island'a sağ tık → Çıkış, sonra tekrar aç).

[colors]
accent = "#C8102E"        # bandana kırmızısı; "#RRGGBB" biçiminde herhangi bir renk

[fonts]
ui = ""                   # yazı tipi adı, boş = sistemin yazı tipi (ör. "Ubuntu", "Inter")

[sound-island]
follow_cover = true       # vurgu rengini albüm kapağından al (false = hep accent rengini kullan)
hide_when_idle = true     # çalan bir şey yokken adayı gizle
bars = "auto"             # "auto" = cava ile gerçek ses çubukları, "simulated" = temsili çubuklar

[terminal]
prompt = true             # iki satırlı Bandanix prompt'u
fetch_on_open = true      # terminal penceresi açılınca bandanix-fetch göster

[duvar-kagidi]
stil = "gece"             # gece, bandana, dalga ya da logo (değiştirmek için: bandanix-duvar <stil>)

[panel]
duzen = "orta"            # "orta" = Windows 11 gibi ortada tek ada + tepsi, "uc-ada" = menü · pencereler · tepsi
yukseklik = 54            # panel yüksekliği (40-64); ada bundan 12 piksel kısa
ikon_boyutu = 32          # panel adalarındaki uygulama ikonları (16-48); sonra: ./install.sh panel-duzeni

[pil]
ust = 80                  # şarj bu yüzdede durur (50-100); değiştirmek için: bandanix-pil sinir 85
alt = 20                  # pil bu yüzdenin altına inince bildirim gelir (5-50)

[not-kutusu]
dosya = "~/Notlar/hizli-notlar.md"   # notların tutulduğu Markdown dosyası
kisayol = "<Super>n"                 # kutuyu açan kısayol; değiştirince: ./install.sh not-kutusu

[sistem-adasi]
islemci = 90              # işlemci 1 dakika boyunca bu yüzdenin üstündeyse ada belirir
sicaklik = 90             # °C
ram = 90                  # yüzde
disk = 95                 # yüzde

[widget]
sehir = ""                # hava durumu şehri; değiştirmek için: bandanix-widget sehir <şehir adı>
