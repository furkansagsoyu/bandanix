# Bandanix ortak tema dosyası
# Bütün Bandanix parçaları bu dosyayı okur, böylece hepsi aynı ailedenmiş gibi görünür.
# Kurulduğu yer: ~/.config/bandanix/theme.toml  (oradaki değişikliklerin yeniden kurulumda korunur)
# Düzenledikten sonra parçayı yeniden başlat (ör. Sound Island'a sağ tık → Çıkış, sonra tekrar aç).

[colors]
accent = "#C8102E"        # bandana kırmızısı; "#RRGGBB" biçiminde herhangi bir renk

[fonts]
ui = ""                   # yazı tipi adı, boş = sistemin yazı tipi (ör. "Ubuntu", "Inter")

[sound-island]
follow_cover = true       # vurgu rengini albüm kapağından al (false = hep accent rengini kullan)
hide_when_idle = true     # çalan bir şey yokken adayı gizle
